name: app
# Сборка и проверка нового приложения (папка app/). Отчёт и скриншоты — в ветку ci-report,
# собранный сайт — в корень основной ветки (https://spilo777.github.io/english-path/), только если все проверки прошли.
# Старый сайт лежит в legacy/ (архив, /english-path/legacy/).
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/app.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: app-ci, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: install
        run: npm install --no-audit --no-fund 2>&1 | tee ../install.log
      - name: typecheck
        id: tsc
        continue-on-error: true
        run: npx tsc --noEmit 2>&1 | tee ../tsc.log; exit ${PIPESTATUS[0]}
      - name: unit tests
        id: unit
        continue-on-error: true
        run: npx vitest run 2>&1 | tee ../unit.log; exit ${PIPESTATUS[0]}
      - name: build
        id: build
        run: BASE=/english-path/ npx vite build 2>&1 | tee ../build.log; exit ${PIPESTATUS[0]}
      - name: e2e
        id: e2e
        continue-on-error: true
        run: |
          npx playwright install --with-deps chromium > /dev/null 2>&1
          mkdir -p shots
          BASE=/english-path/ E2E_URL=http://127.0.0.1:4173/english-path/ npx playwright test 2>&1 | tee ../e2e.log; exit ${PIPESTATUS[0]}
      - name: report
        if: always()
        working-directory: .
        run: |
          mkdir -p /tmp/report && cd /tmp/report
          { echo "commit: $GITHUB_SHA"; echo "tsc: ${{ steps.tsc.outcome }}"; echo "unit: ${{ steps.unit.outcome }}"; echo "build: ${{ steps.build.outcome }}"; echo "e2e: ${{ steps.e2e.outcome }}"; } > status.txt
          for f in install tsc unit build e2e; do [ -f $GITHUB_WORKSPACE/$f.log ] && tail -c 60000 $GITHUB_WORKSPACE/$f.log > $f.log; done
          [ -d $GITHUB_WORKSPACE/app/shots ] && cp -r $GITHUB_WORKSPACE/app/shots . || true
          git init -q && git checkout -q -b ci-report && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "report $GITHUB_SHA"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-report
      - name: deploy
        if: steps.build.outcome == 'success' && steps.tsc.outcome == 'success' && steps.unit.outcome == 'success' && steps.e2e.outcome == 'success'
        working-directory: .
        run: |
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git fetch -q origin main && git checkout -q -B main origin/main
          # в корне — только собранный сайт; исходники в app/, архив в legacy/
          rm -rf index.html assets data img manifest.webmanifest
          cp -r app/dist/. . && touch .nojekyll
          git add -A index.html assets data img manifest.webmanifest .nojekyll
          git commit -qm "deploy: сайт из $GITHUB_SHA" || exit 0
          for i in 1 2 3; do git push -q origin main && break; git pull -q --rebase origin main; done
